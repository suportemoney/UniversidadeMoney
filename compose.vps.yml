# VPS: Docker NÃO ocupa 80/443 — nginx do HOST faz o edge (EducaMoney e outros sites).
# Containers só em 127.0.0.1 (faixa 7101+).
# Um domínio: ${VPS_DOMAIN} — / plataforma, /interno, /painel, /api.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-universidade_user}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:?definir POSTGRES_PASSWORD ou DB_PASSWORD}}
      POSTGRES_DB: ${POSTGRES_DB:-${DB_NAME:-universidade_money}}
    volumes:
      - pgdata_vps:/var/lib/postgresql/data
    networks:
      - universidade
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-universidade_user} -d ${POSTGRES_DB:-universidade_money}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend-prod:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-universidade_money}
      STATIC_ROOT: /data/static
      MEDIA_ROOT: /data/media
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME:-admin}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-admin@moneypromotora.com.br}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-admin123}
    volumes:
      - /var/www/universidade/static:/data/static
      - /var/www/universidade/media:/data/media
    ports:
      - "127.0.0.1:7101:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - universidade
    restart: unless-stopped

  media-prod:
    image: nginx:1.27-alpine
    volumes:
      - /var/www/universidade/media:/data/media:ro
      - ./docker/nginx/media.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:7113:80"
    networks:
      - universidade
    restart: unless-stopped

  frontend-interno-prod:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        FRONTEND_DIR: frontend-plataforma
        BUILD_COMMAND: npm run build:interno
        VITE_SURFACE: interno
        VITE_BASE: /interno/
        VITE_API_URL: /api
        VITE_PLATAFORMA_URL: https://${VPS_DOMAIN:-universidade.moneypromotora.com.br}/login
        VITE_INTERNO_URL: https://${VPS_DOMAIN:-universidade.moneypromotora.com.br}/interno
        VITE_PAINEL_URL: https://${VPS_DOMAIN:-universidade.moneypromotora.com.br}/painel
    ports:
      - "127.0.0.1:7110:80"
    networks:
      - universidade
    restart: unless-stopped

  frontend-plataforma-prod:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        FRONTEND_DIR: frontend-plataforma
        BUILD_COMMAND: npm run build
        VITE_SURFACE: plataforma
        VITE_BASE: /
        VITE_API_URL: /api
        VITE_PLATAFORMA_URL: https://${VPS_DOMAIN:-universidade.moneypromotora.com.br}
        VITE_INTERNO_URL: https://${VPS_DOMAIN:-universidade.moneypromotora.com.br}/interno
        VITE_PAINEL_URL: https://${VPS_DOMAIN:-universidade.moneypromotora.com.br}/painel
    ports:
      - "127.0.0.1:7111:80"
    networks:
      - universidade
    restart: unless-stopped

  frontend-painel-prod:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        FRONTEND_DIR: frontend-painel
        BUILD_COMMAND: npm run build
        VITE_BASE: /painel/
        VITE_API_URL: /api
        VITE_PLATAFORMA_URL: https://${VPS_DOMAIN:-universidade.moneypromotora.com.br}
        VITE_INTERNO_URL: https://${VPS_DOMAIN:-universidade.moneypromotora.com.br}/interno
        VITE_PAINEL_URL: https://${VPS_DOMAIN:-universidade.moneypromotora.com.br}/painel
    ports:
      - "127.0.0.1:7112:80"
    networks:
      - universidade
    restart: unless-stopped
