# Serve uploads (webm, thumbs, PDFs) sem passar pelo Gunicorn.
server {
    listen 80;
    server_name _;

    location /media/ {
        alias /data/media/;
        gzip off;
        sendfile on;
        tcp_nopush on;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        return 404;
    }
}
