# Injetado em educamoney_nginx:/etc/nginx/conf.d/universidade.conf
# NÃO substitui default.conf do EducaMoney (outro server_name).
# Upstreams = serviços do compose UniversidadeMoney na rede compartilhada.

upstream um_backend {
    server backend-prod:8000;
}

upstream um_interno {
    server frontend-interno-prod:80;
}

upstream um_plataforma {
    server frontend-plataforma-prod:80;
}

upstream um_painel {
    server frontend-painel-prod:80;
}

server {
    listen 80;
    server_name universidade.moneypromotora.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name universidade.moneypromotora.com.br;

    ssl_certificate     /etc/letsencrypt/live/universidade.moneypromotora.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/universidade.moneypromotora.com.br/privkey.pem;

    client_max_body_size 500M;

    location /api/ {
        proxy_pass http://um_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        client_max_body_size 500M;
    }

    location /admin/ {
        proxy_pass http://um_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://um_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        access_log off;
    }

    location /media/ {
        proxy_pass http://um_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1200s;
        expires 7d;
    }

    location = /interno {
        return 301 /interno/;
    }

    location /interno/ {
        proxy_pass http://um_interno/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /painel {
        return 301 /painel/;
    }

    location /painel/ {
        proxy_pass http://um_painel/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://um_plataforma;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
