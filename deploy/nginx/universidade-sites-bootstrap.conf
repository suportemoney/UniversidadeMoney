# Bootstrap HTTP (antes do certificado) — injetado em educamoney_nginx conf.d
# Não altera default.conf do EducaMoney

upstream um_backend {
    server backend-prod:8000;
}

upstream um_interno {
    server frontend-interno-prod:80;
}

upstream um_plataforma {
    server frontend-plataforma-prod:80;
}

upstream um_painel {
    server frontend-painel-prod:80;
}

server {
    listen 80;
    server_name universidade.moneypromotora.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://um_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://um_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://um_backend;
        proxy_set_header Host $host;
    }

    location /media/ {
        proxy_pass http://um_backend;
        proxy_set_header Host $host;
    }

    location = /interno {
        return 301 /interno/;
    }

    location /interno/ {
        proxy_pass http://um_interno/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /painel {
        return 301 /painel/;
    }

    location /painel/ {
        proxy_pass http://um_painel/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://um_plataforma;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
